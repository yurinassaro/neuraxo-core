{% extends 'base.html' %}
{% block title %}Integrações - NeuraxoCore{% endblock %}

{% block content %}
<div x-data="integracoes()" x-cloak>

    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Integrações de Pagamento</h1>
        <p class="text-gray-600 dark:text-gray-400">Conecte sua conta de pagamento para receber dos pacientes</p>
    </div>

    <!-- Seletor de Empresa -->
    <div class="mb-6 bg-white dark:bg-gray-800 rounded-xl shadow p-4">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Empresa</label>
        <select x-model="empresaSelecionada" @change="onEmpresaChange()"
            class="w-full max-w-xs px-4 py-2 border dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-indigo-500">
            <option value="">Selecione a empresa...</option>
            {% for emp in empresas %}
            <option value="{{ emp.id }}">{{ emp.nome }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Status do Gateway Atual -->
    <template x-if="gatewayAtivo">
        <div class="mb-6 bg-white dark:bg-gray-800 rounded-xl shadow-lg border-2 border-green-200 dark:border-green-800 p-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 rounded-xl flex items-center justify-center" :class="gatewayAtivo.bg">
                        <span x-html="gatewayAtivo.icon" class="text-2xl"></span>
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-800 dark:text-white text-lg" x-text="gatewayAtivo.nome"></h3>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="inline-flex items-center gap-1 text-sm"
                                :class="gatewayAtivo.status === 'ativo' ? 'text-green-600' : gatewayAtivo.status === 'erro' ? 'text-red-600' : 'text-yellow-600'">
                                <span class="w-2 h-2 rounded-full"
                                    :class="gatewayAtivo.status === 'ativo' ? 'bg-green-500' : gatewayAtivo.status === 'erro' ? 'bg-red-500' : 'bg-yellow-500'"></span>
                                <span x-text="gatewayAtivo.status === 'ativo' ? 'Conectado' : gatewayAtivo.status === 'erro' ? 'Erro na conexão' : 'Pendente'"></span>
                            </span>
                            <template x-if="gatewayAtivo.sandbox">
                                <span class="text-xs bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded-full">Sandbox</span>
                            </template>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button @click="testarConexao()" :disabled="testando"
                        class="px-4 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 disabled:opacity-50">
                        <span x-show="!testando">Testar Conexão</span>
                        <span x-show="testando" class="flex items-center gap-1">
                            <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                            Testando...
                        </span>
                    </button>
                    <form method="post" :action="'/financeiro/integracoes/desconectar/' + empresaSelecionada + '/'"
                        onsubmit="return confirm('Desconectar este gateway?')">
                        {% csrf_token %}
                        <button type="submit" class="px-4 py-2 text-sm bg-red-50 text-red-600 border border-red-200 rounded-lg hover:bg-red-100 dark:bg-red-900/20 dark:border-red-800 dark:text-red-400 dark:hover:bg-red-900/40">
                            Desconectar
                        </button>
                    </form>
                </div>
            </div>
            <template x-if="testeMsg">
                <div class="mt-3 p-3 rounded-lg text-sm"
                    :class="testeOk ? 'bg-green-50 text-green-700 dark:bg-green-900/20 dark:text-green-400' : 'bg-red-50 text-red-700 dark:bg-red-900/20 dark:text-red-400'"
                    x-text="testeMsg"></div>
            </template>
        </div>
    </template>

    <!-- Cards dos Gateways -->
    <template x-if="empresaSelecionada && !gatewayAtivo">
        <div>
            <h2 class="text-lg font-semibold text-gray-800 dark:text-white mb-4">Escolha o gateway de pagamento</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                <!-- Card Mercado Pago -->
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg overflow-hidden border border-gray-200 dark:border-gray-700 hover:shadow-xl transition-shadow">
                    <div class="bg-gradient-to-r from-[#009ee3] to-[#00b1ea] p-6 flex items-center justify-center">
                        <svg viewBox="0 0 48 48" class="w-16 h-16">
                            <circle cx="24" cy="24" r="22" fill="white" opacity="0.2"/>
                            <text x="24" y="30" text-anchor="middle" fill="white" font-size="14" font-weight="bold">MP</text>
                        </svg>
                    </div>
                    <div class="p-5">
                        <h3 class="font-bold text-gray-800 dark:text-white text-lg mb-1">Mercado Pago</h3>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">PIX, cartão de crédito, boleto. Receba na hora via QR Code ou link de pagamento.</p>
                        <div class="flex flex-wrap gap-1 mb-4">
                            <span class="text-xs bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 px-2 py-0.5 rounded-full">PIX</span>
                            <span class="text-xs bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 px-2 py-0.5 rounded-full">Cartão</span>
                            <span class="text-xs bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 px-2 py-0.5 rounded-full">Boleto</span>
                        </div>
                        <button @click="abrirForm('mercadopago')"
                            class="w-full py-2.5 bg-[#009ee3] text-white rounded-lg font-medium hover:bg-[#0088cc] transition-colors">
                            Conectar Mercado Pago
                        </button>
                    </div>
                </div>

                <!-- Card Asaas -->
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg overflow-hidden border border-gray-200 dark:border-gray-700 hover:shadow-xl transition-shadow">
                    <div class="bg-gradient-to-r from-[#1a1a2e] to-[#16213e] p-6 flex items-center justify-center">
                        <svg viewBox="0 0 48 48" class="w-16 h-16">
                            <circle cx="24" cy="24" r="22" fill="white" opacity="0.2"/>
                            <text x="24" y="28" text-anchor="middle" fill="#00c853" font-size="11" font-weight="bold">ASAAS</text>
                        </svg>
                    </div>
                    <div class="p-5">
                        <h3 class="font-bold text-gray-800 dark:text-white text-lg mb-1">Asaas</h3>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">Cobranças recorrentes, PIX, boleto e cartão. Ideal para assinaturas e mensalidades.</p>
                        <div class="flex flex-wrap gap-1 mb-4">
                            <span class="text-xs bg-green-50 text-green-600 dark:bg-green-900/30 dark:text-green-400 px-2 py-0.5 rounded-full">PIX</span>
                            <span class="text-xs bg-green-50 text-green-600 dark:bg-green-900/30 dark:text-green-400 px-2 py-0.5 rounded-full">Boleto</span>
                            <span class="text-xs bg-green-50 text-green-600 dark:bg-green-900/30 dark:text-green-400 px-2 py-0.5 rounded-full">Recorrência</span>
                        </div>
                        <button @click="abrirForm('asaas')"
                            class="w-full py-2.5 bg-[#1a1a2e] text-white rounded-lg font-medium hover:bg-[#16213e] transition-colors">
                            Conectar Asaas
                        </button>
                    </div>
                </div>

                <!-- Card EFI -->
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg overflow-hidden border border-gray-200 dark:border-gray-700 hover:shadow-xl transition-shadow">
                    <div class="bg-gradient-to-r from-[#f37021] to-[#f5942e] p-6 flex items-center justify-center">
                        <svg viewBox="0 0 48 48" class="w-16 h-16">
                            <circle cx="24" cy="24" r="22" fill="white" opacity="0.2"/>
                            <text x="24" y="29" text-anchor="middle" fill="white" font-size="13" font-weight="bold">EFI</text>
                        </svg>
                    </div>
                    <div class="p-5">
                        <h3 class="font-bold text-gray-800 dark:text-white text-lg mb-1">EFI (Gerencianet)</h3>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">PIX integrado, boletos, carnês e cobranças. Conta digital completa.</p>
                        <div class="flex flex-wrap gap-1 mb-4">
                            <span class="text-xs bg-orange-50 text-orange-600 dark:bg-orange-900/30 dark:text-orange-400 px-2 py-0.5 rounded-full">PIX</span>
                            <span class="text-xs bg-orange-50 text-orange-600 dark:bg-orange-900/30 dark:text-orange-400 px-2 py-0.5 rounded-full">Boleto</span>
                            <span class="text-xs bg-orange-50 text-orange-600 dark:bg-orange-900/30 dark:text-orange-400 px-2 py-0.5 rounded-full">Carnê</span>
                        </div>
                        <button @click="abrirForm('efi')"
                            class="w-full py-2.5 bg-[#f37021] text-white rounded-lg font-medium hover:bg-[#e06010] transition-colors">
                            Conectar EFI
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </template>

    <!-- Mensagem se não selecionou empresa -->
    <template x-if="!empresaSelecionada">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-12 text-center">
            <svg class="w-16 h-16 mx-auto text-gray-300 dark:text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
            <p class="text-gray-500 dark:text-gray-400 text-lg">Selecione uma empresa acima para configurar o gateway de pagamento</p>
        </div>
    </template>

    <!-- Modal de Configuração -->
    <div x-show="formAberto" class="fixed inset-0 z-50 flex items-center justify-center p-4" x-transition>
        <div class="fixed inset-0 bg-black/50" @click="formAberto = false"></div>
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md relative z-10 overflow-hidden">

            <!-- Header dinâmico -->
            <div class="p-6 text-white" :class="{
                'bg-gradient-to-r from-[#009ee3] to-[#00b1ea]': formGateway === 'mercadopago',
                'bg-gradient-to-r from-[#1a1a2e] to-[#16213e]': formGateway === 'asaas',
                'bg-gradient-to-r from-[#f37021] to-[#f5942e]': formGateway === 'efi',
            }">
                <h3 class="text-lg font-bold" x-text="formGateway === 'mercadopago' ? 'Conectar Mercado Pago' : formGateway === 'asaas' ? 'Conectar Asaas' : 'Conectar EFI'"></h3>
                <p class="text-sm opacity-80 mt-1" x-text="empresaNome"></p>
            </div>

            <form method="post" action="{% url 'conectar_gateway' %}" enctype="multipart/form-data" class="p-6">
                {% csrf_token %}
                <input type="hidden" name="empresa" :value="empresaSelecionada">
                <input type="hidden" name="gateway" :value="formGateway">

                <div class="space-y-4">

                    <!-- Mercado Pago -->
                    <template x-if="formGateway === 'mercadopago'">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Access Token *</label>
                            <input type="password" name="access_token" required placeholder="APP_USR-..."
                                class="w-full px-4 py-2.5 border dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white text-sm focus:ring-2 focus:ring-blue-500">
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1.5">
                                Encontre em: <a href="https://www.mercadopago.com.br/developers/panel/app" target="_blank" class="text-blue-600 hover:underline">Painel do Desenvolvedor</a> &rarr; Credenciais de Produção
                            </p>
                        </div>
                    </template>

                    <!-- Asaas -->
                    <template x-if="formGateway === 'asaas'">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">API Key *</label>
                                <input type="password" name="api_key" required placeholder="$aas_..."
                                    class="w-full px-4 py-2.5 border dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white text-sm focus:ring-2 focus:ring-green-500">
                                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1.5">
                                    Encontre em: <a href="https://www.asaas.com/customerApiKey/index" target="_blank" class="text-green-600 hover:underline">Asaas &rarr; Integrações &rarr; API Key</a>
                                </p>
                            </div>
                            <label class="flex items-center gap-2 text-sm text-gray-600 dark:text-gray-400">
                                <input type="checkbox" name="sandbox" class="rounded border-gray-300 text-green-600 focus:ring-green-500">
                                Usar ambiente Sandbox (teste)
                            </label>
                        </div>
                    </template>

                    <!-- EFI -->
                    <template x-if="formGateway === 'efi'">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Client ID *</label>
                                <input type="text" name="client_id" required placeholder="Client_Id_..."
                                    class="w-full px-4 py-2.5 border dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white text-sm focus:ring-2 focus:ring-orange-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Client Secret *</label>
                                <input type="password" name="client_secret" required placeholder="Client_Secret_..."
                                    class="w-full px-4 py-2.5 border dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white text-sm focus:ring-2 focus:ring-orange-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Certificado (.pem)</label>
                                <input type="file" name="certificado" accept=".pem,.p12"
                                    class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100">
                                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1.5">
                                    Baixe em: <a href="https://app.efipay.com.br" target="_blank" class="text-orange-600 hover:underline">EFI Pay &rarr; API &rarr; Meus Certificados</a>
                                </p>
                            </div>
                            <label class="flex items-center gap-2 text-sm text-gray-600 dark:text-gray-400">
                                <input type="checkbox" name="sandbox" class="rounded border-gray-300 text-orange-600 focus:ring-orange-500">
                                Usar ambiente Sandbox (teste)
                            </label>
                        </div>
                    </template>

                </div>

                <div class="flex justify-end gap-3 mt-6 pt-4 border-t dark:border-gray-700">
                    <button type="button" @click="formAberto = false" class="px-5 py-2.5 text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">Cancelar</button>
                    <button type="submit" class="px-5 py-2.5 text-sm text-white rounded-lg font-medium" :class="{
                        'bg-[#009ee3] hover:bg-[#0088cc]': formGateway === 'mercadopago',
                        'bg-[#1a1a2e] hover:bg-[#16213e]': formGateway === 'asaas',
                        'bg-[#f37021] hover:bg-[#e06010]': formGateway === 'efi',
                    }">Conectar</button>
                </div>
            </form>
        </div>
    </div>

</div>

<script>
function integracoes() {
    // Dados dos gateways vindos do Django
    const gateways = {
        {% for eid, gw in gateways_por_empresa.items %}
        '{{ eid }}': {
            gateway: '{{ gw.gateway }}',
            status: '{{ gw.status }}',
            sandbox: {{ gw.sandbox|yesno:"true,false" }},
        },
        {% endfor %}
    };

    const gatewayMeta = {
        mercadopago: { nome: 'Mercado Pago', bg: 'bg-[#009ee3]', icon: '<span class="text-white font-bold">MP</span>' },
        asaas: { nome: 'Asaas', bg: 'bg-[#1a1a2e]', icon: '<span class="text-green-400 font-bold text-sm">ASAAS</span>' },
        efi: { nome: 'EFI (Gerencianet)', bg: 'bg-[#f37021]', icon: '<span class="text-white font-bold">EFI</span>' },
    };

    const empresasNome = {
        {% for emp in empresas %}
        '{{ emp.id }}': '{{ emp.nome|escapejs }}',
        {% endfor %}
    };

    return {
        empresaSelecionada: '',
        empresaNome: '',
        gatewayAtivo: null,
        formAberto: false,
        formGateway: '',
        testando: false,
        testeMsg: '',
        testeOk: false,

        onEmpresaChange() {
            this.testeMsg = '';
            this.empresaNome = empresasNome[this.empresaSelecionada] || '';
            const gw = gateways[this.empresaSelecionada];
            if (gw) {
                const meta = gatewayMeta[gw.gateway];
                this.gatewayAtivo = { ...meta, ...gw };
            } else {
                this.gatewayAtivo = null;
            }
        },

        abrirForm(gateway) {
            this.formGateway = gateway;
            this.formAberto = true;
        },

        testarConexao() {
            this.testando = true;
            this.testeMsg = '';
            fetch(`/financeiro/integracoes/testar/${this.empresaSelecionada}/`, {
                method: 'POST',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                },
            })
            .then(r => r.json())
            .then(data => {
                this.testeOk = data.ok;
                this.testeMsg = data.msg;
                if (data.status) this.gatewayAtivo.status = data.status;
            })
            .catch(() => {
                this.testeOk = false;
                this.testeMsg = 'Erro ao testar conexão';
            })
            .finally(() => this.testando = false);
        },
    };
}
</script>
{% endblock %}
