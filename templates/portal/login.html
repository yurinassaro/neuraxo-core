<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Cliente - NeuraxoCore</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-600">Portal do Cliente</h1>
            <p class="text-gray-600 mt-2">Acesse suas solicitacoes</p>
        </div>

        {% if messages %}
        {% for msg in messages %}
        <div class="bg-red-100 text-red-800 p-3 rounded-lg mb-4 text-sm">{{ msg }}</div>
        {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">E-mail</label>
                <input type="email" name="email" required placeholder="seu@email.com" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 font-medium mb-2">Senha</label>
                <input type="password" name="senha" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 font-medium">Entrar</button>
        </form>
    </div>
</body>
</html>
